name: title-requests
on:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
    paths: ['src/lib/words.js']
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency: title-requests
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh label create title-request --color 7057ff --description "Request a ready-made spoiler list" --force || true
          python3 tools/title-requests.py
